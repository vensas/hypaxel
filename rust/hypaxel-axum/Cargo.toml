[package]
name = "hypaxel-axum"
description = "Stream XLSX (Excel) files from axum handlers with constant memory, powered by hypaxel."
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false }
bytes = "1.12.2"
futures-util = "0.3.34"
hypaxel = { version = "0.5.0", path = "../hypaxel", features = ["tokio"] }
serde = "1.0.229"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync", "io-util"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["io"] }

[dev-dependencies]
axum = "0.8.9"
calamine = "0.38.0"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
http-body-util = "0.1.5"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
