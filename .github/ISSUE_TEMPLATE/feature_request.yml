name: Feature request
description: Suggest a new capability or API.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Hypaxel has seven implementations that share one design, so a feature usually needs to fit all of them. Writers are forward-only and constant-memory by default; anything that has to buffer must stay bounded and opt-in.

        Check the [roadmap](https://github.com/vensas/hypaxel#roadmap) first; your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current API does not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work. An API sketch in your language is welcome.
    validations:
      required: true
  - type: dropdown
    id: implementations
    attributes:
      label: Implementations you need it in
      multiple: true
      options:
        - .NET
        - Rust
        - Python
        - Node.js (native)
        - Browser (WebAssembly)
        - Go
        - Java
        - PHP
    validations:
      required: true
  - type: textarea
    id: prior-art
    attributes:
      label: How other libraries handle it
      description: For example how openpyxl, ClosedXML, Apache POI, excelize or ExcelJS expose the same feature.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds
      description: What you do today instead, if anything.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you open a pull request?
      options:
        - "No"
        - "Yes, after we agree on the design"
