name: Rust

# Path filters on push compare only the commits in that push, so a push runs just the
# workflows whose files it touched. Pull request runs compare the whole PR, so they are
# limited to forks, whose pushes do not trigger workflows here.
on:
  push:
    paths: ["rust/**", ".github/workflows/rust.yml", "testdata/**"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml", "testdata/**"]

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets
      - run: cargo test --workspace --all-features
      - run: cargo test -p hypaxel --no-default-features
      - run: cargo build -p hypaxel --no-default-features --features tokio

  msrv:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.85"
      - run: cargo build -p hypaxel -p hypaxel-axum --all-features
