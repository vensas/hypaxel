name: Node

# Path filters on push compare only the commits in that push, so a push runs just the
# workflows whose files it touched. Pull request runs compare the whole PR, so they are
# limited to forks, whose pushes do not trigger workflows here.
on:
  push:
    paths: ["node/**", "rust/hypaxel/**", ".github/workflows/node.yml"]
  pull_request:
    paths: ["node/**", "rust/hypaxel/**", ".github/workflows/node.yml"]

defaults:
  run:
    working-directory: node

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node
      - run: npm ci
      - run: npm run build
      - run: npm test

  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node
      - run: cargo fmt --check
      - run: cargo clippy --all-targets

  native:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: node/*.node
