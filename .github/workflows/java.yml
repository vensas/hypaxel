name: Java

# Path filters on push compare only the commits in that push, so a push runs just the
# workflows whose files it touched. Pull request runs compare the whole PR, so they are
# limited to forks, whose pushes do not trigger workflows here.
on:
  push:
    paths: ["java/**", ".github/workflows/java.yml", "testdata/**"]
  pull_request:
    paths: ["java/**", ".github/workflows/java.yml", "testdata/**"]

defaults:
  run:
    working-directory: java

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25", "27"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: java/pom.xml
      - run: ./mvnw -B verify
