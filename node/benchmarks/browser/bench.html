<!doctype html>
<meta charset="utf-8" />
<title>hypaxel browser benchmark</title>
<script type="module">
  // One case per page load, so every case starts from a fresh renderer. The data is built before
  // timing starts, and each library turns the same array of rows into a complete XLSX Blob.
  const params = new URLSearchParams(location.search)
  const name = params.get('case')
  const count = Number(params.get('rows'))
  const runs = Number(params.get('runs') ?? 3)

  const CATEGORIES = ['Hardware', 'Software', 'Services', 'Consulting', 'Support', 'Training']
  const START = Date.UTC(2024, 0, 1)
  const HEADER = ['id', 'name', 'category', 'price', 'amount', 'created', 'active', 'quantity', 'comment', 'ratio']
  const TYPE = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'

  function script(src) {
    return new Promise((resolve, reject) => {
      const element = document.createElement('script')
      element.src = src
      element.onload = resolve
      element.onerror = () => reject(new Error(`failed to load ${src}`))
      document.head.append(element)
    })
  }

  const data = Array.from({ length: count }, (_, i) => [
    i,
    `Customer ${i % 5000}`,
    CATEGORIES[i % CATEGORIES.length],
    i * 1.25,
    i * 0.01,
    new Date(START + i * 60_000),
    i % 2 === 0,
    i * 3,
    `Unique comment #${i}`,
    i / 7,
  ])

  let wasmMemory = () => undefined
  const CASES = {
    async 'hypaxel (WebAssembly)'() {
      const { init, toBlob } = await import('/lib/browser/browser.js')
      const glue = await import('/lib/browser/wasm/hypaxel.js')
      await init()
      const exports = await glue.default()
      wasmMemory = () => exports.memory.buffer.byteLength
      return () => toBlob(data, { columns: HEADER, dates: 'utc' })
    },
    async 'SheetJS 0.20.3'() {
      await script('/node_modules/xlsx/dist/xlsx.full.min.js')
      return async () => {
        const sheet = XLSX.utils.aoa_to_sheet([HEADER, ...data])
        const book = XLSX.utils.book_new()
        XLSX.utils.book_append_sheet(book, sheet, 'Sheet1')
        return new Blob([XLSX.write(book, { type: 'array', bookType: 'xlsx', compression: true })], { type: TYPE })
      }
    },
    async 'ExcelJS 4.4.0'() {
      await script('/node_modules/exceljs/dist/exceljs.min.js')
      return async () => {
        const book = new ExcelJS.Workbook()
        const sheet = book.addWorksheet('Sheet1')
        sheet.addRow(HEADER)
        sheet.addRows(data)
        return new Blob([await book.xlsx.writeBuffer()], { type: TYPE })
      }
    },
  }

  let report
  try {
    const run = await CASES[name]()
    const times = []
    let bytes = 0
    for (let i = 0; i < runs; i++) {
      const started = performance.now()
      const blob = await run()
      times.push(performance.now() - started)
      bytes = blob.size
      const head = new Uint8Array(await blob.slice(0, 2).arrayBuffer())
      if (head[0] !== 0x50 || head[1] !== 0x4b) throw new Error('output is not a zip file')
    }
    report = { name, count, times, bytes, wasmMemory: wasmMemory(), userAgent: navigator.userAgent }
  } catch (error) {
    report = { name, count, error: String(error && error.stack ? error.stack : error) }
  }
  await fetch('/result', { method: 'POST', body: JSON.stringify(report) })
</script>
