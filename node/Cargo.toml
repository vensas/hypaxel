[package]
name = "hypaxel-node"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
hypaxel = { version = "0.1.0", path = "../rust/hypaxel", default-features = false, features = ["chrono"] }
napi = { version = "3.16.2", default-features = false, features = ["napi8"] }
napi-derive = "3.7.1"

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
lto = true
codegen-units = 1
