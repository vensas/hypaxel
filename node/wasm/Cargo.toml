[package]
name = "hypaxel-wasm"
description = "WebAssembly build of the hypaxel XLSX writer, for browsers and other JavaScript runtimes without native modules."
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
hypaxel-js-engine = { path = "../engine", features = ["serde"] }
js-sys = "0.3.81"
serde = "1.0.229"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "=0.2.130"
