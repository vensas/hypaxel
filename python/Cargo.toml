[package]
name = "hypaxel-py"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[lib]
name = "_hypaxel"
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
hypaxel = { version = "0.1.0", path = "../rust/hypaxel", default-features = false, features = ["chrono"] }
pyo3 = { version = "0.30.1", features = ["extension-module"] }
